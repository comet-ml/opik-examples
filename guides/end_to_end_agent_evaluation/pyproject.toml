[project]
name = "end-to-end-agent-evaluation"
version = "0.1.0"
description = "Evaluate an LLM agent across its lifecycle with Opik: trace, baseline, judge, align, gate, monitor online, close the loop."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipywidgets>=8.1.0",
    "matplotlib>=3.9.0",
    "openai>=2.0.0",
    "opik>=2.2.72",
]

[dependency-groups]
dev = ["ruff"]

# WHY: notebook-only example; uv manages the env, no installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
# WHY: ruff can't parse the notebook's cell schema; lint .py files only.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
