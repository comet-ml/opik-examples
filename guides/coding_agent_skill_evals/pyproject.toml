[project]
name = "coding-agent-skill-evals"
version = "0.1.0"
description = "Test coding-agent skills (SKILL.md) with Opik test suites: one evals.yaml per skill, a pass/fail exit code for CI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opik>=2.2.144",
    "litellm",
    "pyyaml",
]

[project.scripts]
skill-evals = "run_skill_evals:main"

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# WHY: single top-level module (not a src/ package) — point hatchling at the one file.
[tool.hatch.build.targets.wheel]
include = ["run_skill_evals.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
