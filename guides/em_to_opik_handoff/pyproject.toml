[project]
name = "em-to-opik-handoff"
version = "0.1.0"
description = "Fine-tune in Comet EM, evaluate in Opik: the Model Registry as the only link, with a gate that promotes or holds a training run"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opik>=2.2",
    "litellm>=1.70",
    "comet-ml>=3.58",
    "pillow",
]

[project.optional-dependencies]
# WHY: torch is too heavy for the CI lint and dry-run jobs; training and detector inference need it.
detector = ["ultralytics>=8.4"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roadwork_demo"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
