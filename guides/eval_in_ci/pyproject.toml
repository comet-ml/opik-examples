[project]
name = "eval-in-ci"
version = "0.1.0"
description = "Run Opik evaluations in CI with a pass/fail digest, and close the loop with a coding agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["opik>=2.2", "pyyaml>=6"]

[project.optional-dependencies]
optimizer = ["opik-optimizer>=3.2"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
