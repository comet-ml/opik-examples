# This template lives in guides/eval_in_ci/ of opik-examples. Copy it to .github/workflows/opik-eval.yml in your repo.
# Paths below assume you copied the eval_in_ci folder to examples/eval_in_ci/.
# Adjust them if you put it somewhere else.
# Fork PRs get empty secrets and a read-only token, so the eval exits 2 there by design.
#
# Settings: secrets OPIK_API_KEY plus ANTHROPIC_API_KEY or OPENAI_API_KEY; variables OPIK_WORKSPACE and,
# optionally, OPIK_URL_OVERRIDE, OPIK_EXAMPLES_MODEL, OPIK_ONLINE_JUDGE_MODEL.
# Pull requests run the gate (--fail-on-regression). A push to main tags the baseline, promotes the
# prompt to production and sends traffic (--mark-baseline). opik-optimize.yml dispatches this
# workflow on its optimize/<n> branch, so keep workflow_dispatch.
name: opik-eval

on:
  pull_request:
    # paths:
    #   - "src/**"
    #   - "examples/eval_in_ci/**"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: opik-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      # Security-reviewed repos usually pin these to commit SHAs.
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # prompts/ and planner.py are not listed: the prompt file is what eval/* and optimize/*
          # branches change, and planner.py is the app being improved. The rest defines the eval.
          filters: |
            eval_paths:
              - 'examples/eval_in_ci/composite_metric.py'
              - 'examples/eval_in_ci/scenarios.py'
              - 'examples/eval_in_ci/setup_opik.py'
              - 'examples/eval_in_ci/eval_compare.py'
              - 'examples/eval_in_ci/run_eval.py'
              - 'examples/eval_in_ci/opik_access.py'
              - '.github/workflows/opik-eval.yml'
              - 'opik-release-policy.yaml'
              - '.opik/**'
      - name: Block eval definition changes on eval/* and optimize/* branches
        # On push events github.head_ref is empty, so this guard passes.
        if: (startsWith(github.head_ref, 'eval/') || startsWith(github.head_ref, 'optimize/')) && steps.filter.outputs.eval_paths == 'true'
        run: |
          echo "::error::eval/* and optimize/* branches may not change eval definitions"
          exit 1

  eval:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      # Security-reviewed repos usually pin these to commit SHAs.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        working-directory: examples/eval_in_ci
        run: uv sync
      # - name: Install your project
      #   run: pip install -e .   # or: uv sync --project . ; whatever makes your --task importable
      - name: Run evaluation
        id: eval
        continue-on-error: true
        working-directory: examples/eval_in_ci
        env:
          OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
          OPIK_WORKSPACE: ${{ vars.OPIK_WORKSPACE }}
          # An unset variable expands to "", which the SDK takes literally; default to Opik Cloud.
          OPIK_URL_OVERRIDE: ${{ vars.OPIK_URL_OVERRIDE || 'https://www.comet.com/opik/api' }}
          OPIK_EXAMPLES_MODEL: ${{ vars.OPIK_EXAMPLES_MODEL }}
          OPIK_ONLINE_JUDGE_MODEL: ${{ vars.OPIK_ONLINE_JUDGE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPIK_PROJECT_NAME: eval-in-ci-example
          # On pull_request, github.sha is the merge commit; name runs by the PR head.
          OPIK_EVAL_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MODE_FLAG: ${{ github.event_name == 'push' && '--mark-baseline' || '--fail-on-regression' }}
        # Exit codes: 0 ok or baseline created, 1 policy failed, 2 config or connection error.
        # The exit code is captured so the artifact and comment steps still run.
        run: |
          set +e
          uv run python run_eval.py run --dataset scenario-planner --task planner:make_eval_task \
            --metric scenarios:build_metric --prompt-file prompts/system.txt \
            --setup setup_opik:run_setup --suite-task planner:make_suite_task \
            --suite-name scenario-planner-guardrails --traffic planner:simulate_traffic_hook \
            "$MODE_FLAG" --out digest.md --json digest.json --summary "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opik-eval-digest
          path: |
            examples/eval_in_ci/digest.md
            examples/eval_in_ci/digest.json
          if-no-files-found: ignore
      - name: Post sticky PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('examples/eval_in_ci/digest.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('examples/eval_in_ci/digest.md', 'utf8');
            const marker = '<!-- opik-eval -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Fail the job if the eval failed
        if: always()
        env:
          EVAL_EXIT_CODE: ${{ steps.eval.outputs.exit_code }}
        run: exit "${EVAL_EXIT_CODE:-2}"
