[project]
name = "prompt-versioning"
version = "0.1.0"
description = "Version prompts in the Opik Prompt Library, compare versions for hallucination, and run inference against prompt versions via LiteLLM."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "litellm>=1.0.0",
    "opik>=2.0.74",
]

[dependency-groups]
dev = ["ruff"]

# WHY: notebook-only example — uv manages the env, no installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
# WHY: ruff can't parse the notebook's cell schema; lint .py files only.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
