[project]
name = "tracing-three-ways"
version = "0.1.0"
description = "Log the same agent flow to Opik three ways: the Python SDK, an LLM integration and OpenTelemetry."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opik>=2.2.0",
    "anthropic",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
]

[dependency-groups]
dev = ["ruff"]

# WHY: notebook-only example — uv manages the env, no installable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
# WHY: ruff can't parse the notebook's cell schema; lint .py files only.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
