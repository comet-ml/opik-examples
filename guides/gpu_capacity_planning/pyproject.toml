[project]
name = "gpu-capacity-planning"
version = "0.1.0"
description = "MCP-driven GPU capacity planning: Comet EM system metrics analyzed by an LLM, traced in Opik"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opik>=2.0",
    "litellm",
    "typer",
    "mcp>=2",
]

[project.scripts]
gpu-capacity-planning = "gpu_capacity_planning.cli:main"

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_capacity_planning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer uses function-call defaults (typer.Option/Argument) by design.
"**/cli.py" = ["B008"]
