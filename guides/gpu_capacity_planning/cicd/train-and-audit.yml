# Reference workflow: copy to .github/workflows/ in YOUR training repo.
# Manually dispatched: run a training job, then generate the capacity + quality report.
# Secrets to configure in your repo: COMET_API_KEY, OPIK_API_KEY, ANTHROPIC_API_KEY
# and variables: COMET_WORKSPACE, OPIK_WORKSPACE.

name: Train and audit

on:
  workflow_dispatch:
    inputs:
      project:
        description: Comet EM project for the training run
        default: capacity-demo-training
      epochs:
        description: Training epochs
        default: "2"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  train-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMET_API_KEY: ${{ secrets.COMET_API_KEY }}
      COMET_WORKSPACE: ${{ vars.COMET_WORKSPACE }}
      OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
      OPIK_WORKSPACE: ${{ vars.OPIK_WORKSPACE }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROJECT: ${{ inputs.project }}
      EPOCHS: ${{ inputs.epochs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1

      - name: Install (with training extra)
        run: uv sync --extra train

      - name: Train (2 DDP ranks on CPU; swap nproc for your GPU count)
        run: |
          uv run torchrun --nproc_per_node=2 -m gpu_capacity_planning.train_demo \
            --epochs "$EPOCHS" --project "$PROJECT"

      - name: Capacity + quality report (traced in Opik, queued for review)
        run: |
          uv run gpu-capacity-planning report --project "$PROJECT" --output report.md

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capacity-report
          path: report.md

