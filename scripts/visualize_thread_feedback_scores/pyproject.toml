[project]
name = "visualize-thread-feedback-scores"
version = "0.1.0"
description = "Plot turn-by-turn feedback scores for a multi-turn Opik conversation thread"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "opik>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
visualize-thread-feedback-scores = "visualize_thread_feedback_scores:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["visualize_thread_feedback_scores.py"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
